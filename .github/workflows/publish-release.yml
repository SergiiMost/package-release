name: Publish Release

on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project (library) name to release, e.g. js-lib or angular-lib'
        required: true
        type: string
      version_bump:
        description: 'Semver bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      commit:
        description: 'Git commit SHA to release from (defaults to the latest commit on the default branch)'
        required: false
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.project }}
  cancel-in-progress: false

jobs:
  publish-release:
    name: Publish release
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push the release commit/tag
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.commit || github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Test and build
        run: npx nx run-many -t test build -p "${{ inputs.project }}"

      - name: Version release
        run: npx nx release version --specifier=${{ inputs.version_bump }} -p "${{ inputs.project }}"

      - name: Publish package
        run: npx nx release publish --tag=latest -p "${{ inputs.project }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}

      # the version-bump commit is never pushed to the default branch (avoids
      # branch protection issues); only the tag is pushed, which is the
      # source of truth for released versions (see currentVersionResolver)
      - name: Push release tag
        run: git push origin "$(git describe --tags --exact-match HEAD)"
