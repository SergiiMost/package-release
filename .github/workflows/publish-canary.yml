name: Publish Canary

on:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-canary:
    name: Publish canary
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # needed for npm provenance
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          registry-url: https://registry.npmjs.org/

      - name: Install dependencies
        run: npm ci

      - name: Derive appropriate SHAs for base/head for `nx affected` commands
        uses: nrwl/nx-set-shas@v4

      - name: Test and build affected
        run: npx nx affected -t test build

      - name: Determine affected publishable projects
        id: affected
        run: |
          projects=$(npx nx show projects --affected --withTarget nx-release-publish --sep=,)
          echo "projects=$projects" >> "$GITHUB_OUTPUT"

      - name: Publish canary versions
        if: steps.affected.outputs.projects != ''
        run: |
          short_sha=$(git rev-parse --short HEAD)
          npx nx release version --specifier=prerelease --preid="next.$short_sha" \
            --git-commit=false --git-tag=false \
            -p "${{ steps.affected.outputs.projects }}"
          npx nx release publish --tag=next -p "${{ steps.affected.outputs.projects }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_ACCESS_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
